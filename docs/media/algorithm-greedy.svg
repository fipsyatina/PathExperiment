<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400" role="img" aria-labelledby="title desc">
  <title id="title">Greedy best-first search flow and heuristic trap</title>
  <desc id="desc">Greedy best-first search expands the cell with the smallest Manhattan heuristic h. It heads directly toward the goal and can choose a costly ten-step swamp route instead of a cheaper fourteen-step road detour.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#475569"/></marker></defs>
  <rect width="960" height="400" fill="#ffffff"/>
  <text x="36" y="48" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="700" fill="#111827">Greedy best-first — priority = h</text>
  <text x="36" y="78" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#475569">Follow the cell that appears closest to the goal; accumulated cost does not affect priority.</text>
  <g font-family="Arial,Helvetica,sans-serif" font-size="15" text-anchor="middle">
    <rect x="36" y="116" width="174" height="62" rx="2" fill="#e0ebf5" stroke="#245b89" stroke-width="2"/><text x="123" y="142" fill="#111827">Queue start</text><text x="123" y="163" fill="#475569">Manhattan h(S)</text>
    <path d="M210 147H248" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="250" y="116" width="190" height="62" rx="2" fill="#ffffff" stroke="#64748b" stroke-width="2"/><text x="345" y="142" fill="#111827">Pop minimum h</text><text x="345" y="163" fill="#475569">goal? return route</text>
    <path d="M440 147H478" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="480" y="116" width="210" height="62" rx="2" fill="#ffffff" stroke="#64748b" stroke-width="2"/><text x="585" y="142" fill="#111827">Discover neighbors</text><text x="585" y="163" fill="#475569">store parents and cost</text>
    <path d="M690 147H728" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="730" y="116" width="194" height="62" rx="2" fill="#fff7ed" stroke="#b45309" stroke-width="2"/><text x="827" y="142" fill="#111827">Queue by h</text><text x="827" y="163" fill="#475569">keep first parent</text>
  </g>
  <text x="36" y="225" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700" fill="#111827">Illustrative heuristic trap</text>
  <circle cx="92" cy="310" r="24" fill="#e0ebf5" stroke="#245b89" stroke-width="3"/><text x="92" y="316" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700">S</text>
  <circle cx="870" cy="310" r="24" fill="#e3f2ea" stroke="#1d8258" stroke-width="3"/><text x="870" y="316" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700">G</text>
  <path d="M116 300C310 245 650 245 846 300" fill="none" stroke="#b91c1c" stroke-width="7"/>
  <text x="480" y="252" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" fill="#991b1b">h drops quickly: 10 swamp entries, cost 50</text>
  <path d="M116 321C310 378 650 378 846 321" fill="none" stroke="#1d8258" stroke-width="7" stroke-dasharray="10 7"/>
  <text x="480" y="390" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#1d8258">cheaper but initially farther: 14 road entries, cost 14</text>
</svg>
