<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400" role="img" aria-labelledby="title desc">
  <title id="title">Breadth-first search flow and weighted-terrain warning</title>
  <desc id="desc">Breadth-first search expands cells by increasing number of steps. It chooses a ten-step route costing fifty over a fourteen-step road route costing fourteen because it ignores terrain cost when prioritizing.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#475569"/></marker></defs>
  <rect width="960" height="400" rx="18" fill="#f8fafc"/>
  <text x="36" y="48" font-family="system-ui,sans-serif" font-size="25" font-weight="700" fill="#111827">Breadth-first search — priority = depth</text>
  <text x="36" y="78" font-family="system-ui,sans-serif" font-size="15" fill="#475569">Expand every cell at depth d before any cell at depth d + 1.</text>
  <g font-family="system-ui,sans-serif" font-size="15" text-anchor="middle">
    <rect x="36" y="116" width="174" height="62" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="123" y="142" fill="#111827">Depth(S) = 0</text><text x="123" y="163" fill="#475569">enqueue start</text>
    <path d="M210 147H248" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="250" y="116" width="190" height="62" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="2"/><text x="345" y="142" fill="#111827">Pop lowest depth</text><text x="345" y="163" fill="#475569">FIFO within a layer</text>
    <path d="M440 147H478" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="480" y="116" width="210" height="62" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="2"/><text x="585" y="142" fill="#111827">Discover neighbors</text><text x="585" y="163" fill="#475569">depth′ = depth + 1</text>
    <path d="M690 147H728" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="730" y="116" width="194" height="62" rx="10" fill="#fff7ed" stroke="#b45309" stroke-width="2"/><text x="827" y="142" fill="#111827">Goal reached</text><text x="827" y="163" fill="#475569">fewest steps</text>
  </g>
  <text x="36" y="240" font-family="system-ui,sans-serif" font-size="17" font-weight="700" fill="#111827">Illustrative weighted warning</text>
  <circle cx="92" cy="310" r="24" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/><text x="92" y="316" text-anchor="middle" font-family="system-ui,sans-serif" font-size="18" font-weight="700">S</text>
  <circle cx="870" cy="310" r="24" fill="#dcfce7" stroke="#0f766e" stroke-width="3"/><text x="870" y="316" text-anchor="middle" font-family="system-ui,sans-serif" font-size="18" font-weight="700">G</text>
  <path d="M116 300C310 245 650 245 846 300" fill="none" stroke="#b91c1c" stroke-width="7"/>
  <text x="480" y="265" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" font-weight="700" fill="#991b1b">chosen: 10 swamp entries × 5 = cost 50</text>
  <path d="M116 321C310 378 650 378 846 321" fill="none" stroke="#0f766e" stroke-width="7" stroke-dasharray="10 7"/>
  <text x="480" y="378" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" fill="#0f766e">ignored by step priority: 14 road entries × 1 = cost 14</text>
</svg>
